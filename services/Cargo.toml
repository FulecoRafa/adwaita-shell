[package]
name = "adwaita-services"
description = "adwaita-shell's services (audio, network, notifications, media...) in one process"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: built from this directory, next to the TSX project.
[workspace]

[dependencies]
tessela-service = { path = "../../tessela/sdk/rust", features = ["process", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-lite = "2"
async-io = "2"
libc = "0.2"
# covers: content-addressed names, data: URLs
sha1_smol = "1"
base64 = "0.22"
# weather and covers over https (blocking, run off the main thread)
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
