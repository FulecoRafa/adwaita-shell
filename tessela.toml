# adwaita-shell: the reference Quickshell config rebuilt as a tessela project.
# Each surface is an entry (like a page). kit/ is the reusable package
# (@kit): components, widgets, generic data and the theme; src/ is the shell.
# src/data and kit/data are the only code that touches modules.

name = "adwaita-shell"
font = "CaskaydiaCove Nerd Font"
themes = ["kit/theme.toml"]

[imports]
kit = "kit"

# One extension per surface. All of them share `shared(...)` state.
[surfaces.bar]
entry = "src/surfaces/bar.tsx"
capabilities = ["context", "state", "timer", "hyprland", "hyprland:dispatch", "system", "apps", "apps:launch", "tray",
                "service:audio", "service:network", "service:notifications", "service:ai", "service:agenda"]

[surfaces.drawer]
entry = "src/surfaces/drawer.tsx"
capabilities = ["context", "state", "timer", "system", "apps:launch",
                "service:media", "service:weather", "service:network", "service:ai", "service:power", "service:agenda"]

[surfaces.launcher]
entry = "src/surfaces/launcher.tsx"
capabilities = ["context", "state", "apps", "apps:launch"]

# Panels hanging from the bar; `panel` (shared state) says which one is open.
[surfaces.control]
entry = "src/surfaces/control.tsx"
capabilities = ["context", "state", "timer", "system", "apps:launch",
                "service:audio", "service:network", "service:power", "service:brightness", "service:notifications"]

[surfaces.notifications]
entry = "src/surfaces/notifications.tsx"
capabilities = ["context", "state", "apps", "service:notifications"]

[surfaces.ai]
entry = "src/surfaces/ai.tsx"
capabilities = ["context", "state", "service:ai"]

[surfaces.power]
entry = "src/surfaces/power.tsx"
capabilities = ["context", "state", "timer", "apps:launch"]

# Services this project ships: one process (services/, Rust) serving one
# socket per service, <runtime dir>/services/<name>.sock. Build it first:
#   cargo build --release --manifest-path services/Cargo.toml
# The runner starts it, waits for these sockets and restarts it if it dies.
[plugins.services]
command = ["services/target/release/adwaita-services"]
services = ["agenda", "ai", "audio", "brightness", "media", "network", "notifications", "power", "weather"]
